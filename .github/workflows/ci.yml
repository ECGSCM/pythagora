name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual redeploy of the live site without needing a new commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc -b

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  # Publishes the built site to the `gh-pages` branch, which is what this
  # repository's Pages is configured to serve ("Deploy from a branch").
  #
  # This job previously used the Pages *deployment API*
  # (configure-pages / upload-pages-artifact / deploy-pages). That path
  # additionally requires Settings → Pages → Source to be "GitHub Actions";
  # because the repo serves from a branch instead, the `github-pages`
  # environment could not be resolved and the job failed instantly, before
  # any step ran (no logs, 0 steps, ~2s). Every push to main since has built
  # green but never reached the live site, so the site could only be updated
  # by hand. Pushing the build output to `gh-pages` matches the existing
  # setting and needs no repository configuration change.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    # Required to push the built site to the gh-pages branch.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Publishes dist/ to the gh-pages branch. The action writes a .nojekyll
      # file by default, so Vite's `assets/` output is served verbatim.
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
